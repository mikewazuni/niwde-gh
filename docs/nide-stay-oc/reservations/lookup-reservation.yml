info:
  name: Lookup Reservations
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8190/api/reservations/lookup
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "phone": "081200000001"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'

settings:
  encodeUrl: true

docs: |-
  Front-office "cek booking saya".

  - Body: `{phone?}` / `{email?}` lists all guest bookings, or `{reservation_id}` (+ optional contact check) fetches one.
  - At least one of `phone`, `email`, `reservation_id` required.
  - Wrong contact for a `reservation_id` returns `403`.
  - Response: `{count, reservations: [{id, from_date, to_date, nights, total_price, room{id,label,type}}]}`.
