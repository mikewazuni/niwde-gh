info:
  name: Available Rooms
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8190/api/rooms/available
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "from_date": "2026-09-12",
        "to_date": "2026-09-13"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: '200'

settings:
  encodeUrl: true

docs: |-
  List available rooms (maintenance=false, no overlapping reservation).

  - `from_date`: required `YYYY-MM-DD`, today or later.
  - `to_date`: required `YYYY-MM-DD`, must be after `from_date`.
  - `room_type`: optional `room_types` name (case-insensitive).
